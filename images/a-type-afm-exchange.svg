<svg xmlns="http://www.w3.org/2000/svg" width="960" height="430" viewBox="0 0 960 430" role="img" aria-labelledby="title desc">
  <title id="title">Exchange bonds in an A-type antiferromagnet</title>
  <desc id="desc">A side view of two layers. Spins are parallel along each layer and antiparallel across the interlayer bonds.</desc>
  <defs>
    <marker id="blue-head" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#1769aa"/></marker>
    <marker id="red-head" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#c23b4a"/></marker>
  </defs>
  <rect width="960" height="430" rx="28" fill="#fbfcfe"/>
  <text x="48" y="57" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" fill="#182433">Exchange view</text>
  <text x="48" y="88" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" fill="#526171">nearest-neighbor picture in the ASTRO sign convention</text>

  <g stroke="#1769aa" stroke-width="7" stroke-linecap="round">
    <line x1="200" y1="175" x2="360" y2="175"/><line x1="400" y1="175" x2="560" y2="175"/><line x1="600" y1="175" x2="760" y2="175"/>
  </g>
  <g stroke="#c23b4a" stroke-width="7" stroke-linecap="round">
    <line x1="200" y1="315" x2="360" y2="315"/><line x1="400" y1="315" x2="560" y2="315"/><line x1="600" y1="315" x2="760" y2="315"/>
  </g>
  <g stroke="#725ba6" stroke-width="4" stroke-dasharray="9 8">
    <line x1="180" y1="185" x2="180" y2="305"/><line x1="380" y1="185" x2="380" y2="305"/><line x1="580" y1="185" x2="580" y2="305"/><line x1="780" y1="185" x2="780" y2="305"/>
  </g>

  <g fill="#fff" stroke-width="3">
    <circle cx="180" cy="175" r="10" stroke="#1769aa"/><circle cx="380" cy="175" r="10" stroke="#1769aa"/><circle cx="580" cy="175" r="10" stroke="#1769aa"/><circle cx="780" cy="175" r="10" stroke="#1769aa"/>
    <circle cx="180" cy="315" r="10" stroke="#c23b4a"/><circle cx="380" cy="315" r="10" stroke="#c23b4a"/><circle cx="580" cy="315" r="10" stroke="#c23b4a"/><circle cx="780" cy="315" r="10" stroke="#c23b4a"/>
  </g>
  <g stroke="#1769aa" stroke-width="6" stroke-linecap="round" marker-end="url(#blue-head)">
    <line x1="180" y1="165" x2="180" y2="115"/><line x1="380" y1="165" x2="380" y2="115"/><line x1="580" y1="165" x2="580" y2="115"/><line x1="780" y1="165" x2="780" y2="115"/>
  </g>
  <g stroke="#c23b4a" stroke-width="6" stroke-linecap="round" marker-end="url(#red-head)">
    <line x1="180" y1="325" x2="180" y2="375"/><line x1="380" y1="325" x2="380" y2="375"/><line x1="580" y1="325" x2="580" y2="375"/><line x1="780" y1="325" x2="780" y2="375"/>
  </g>

  <g font-family="Inter, Segoe UI, Arial, sans-serif" text-anchor="middle">
    <text x="45" y="169" text-anchor="start" font-size="17" font-weight="700" fill="#1769aa">FM: J∥ &lt; 0</text>
    <text x="45" y="309" text-anchor="start" font-size="17" font-weight="700" fill="#c23b4a">FM: J∥ &lt; 0</text>
    <rect x="800" y="218" width="140" height="54" rx="13" fill="#f0ebfa" stroke="#ad9dcc"/>
    <text x="870" y="239" font-size="15" fill="#604b8c">interplane</text>
    <text x="870" y="259" font-size="16" font-weight="700" fill="#604b8c">J⊥ &gt; 0</text>
  </g>
</svg>
