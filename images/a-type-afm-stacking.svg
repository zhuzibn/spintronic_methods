<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620" role="img" aria-labelledby="title desc">
  <title id="title">A-type antiferromagnetic stacking</title>
  <desc id="desc">Three ferromagnetic spin planes stacked along z. Spins point up in the top and bottom planes and down in the middle plane.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7fbff"/>
      <stop offset="1" stop-color="#eef2f7"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="7" stdDeviation="7" flood-color="#24364b" flood-opacity="0.16"/>
    </filter>
    <marker id="arrow-blue" markerWidth="7" markerHeight="7" refX="5.8" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="#1769aa"/>
    </marker>
    <marker id="arrow-red" markerWidth="7" markerHeight="7" refX="5.8" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="#c23b4a"/>
    </marker>
    <g id="up-spin">
      <circle cx="0" cy="0" r="7" fill="#fff" stroke="#1769aa" stroke-width="3"/>
      <line x1="0" y1="-2" x2="0" y2="-45" stroke="#1769aa" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow-blue)"/>
    </g>
    <g id="down-spin">
      <circle cx="0" cy="0" r="7" fill="#fff" stroke="#c23b4a" stroke-width="3"/>
      <line x1="0" y1="2" x2="0" y2="45" stroke="#c23b4a" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow-red)"/>
    </g>
  </defs>

  <rect width="960" height="620" rx="28" fill="url(#bg)"/>
  <text x="52" y="62" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="30" font-weight="700" fill="#182433">A-type antiferromagnetic order</text>
  <text x="52" y="94" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" fill="#526171">ferromagnetic within each plane · antiferromagnetic between planes</text>

  <g filter="url(#shadow)">
    <path d="M210 170 L650 170 L770 230 L330 230 Z" fill="#dcecff" stroke="#87add1" stroke-width="2"/>
    <path d="M210 320 L650 320 L770 380 L330 380 Z" fill="#ffe1e4" stroke="#d6939b" stroke-width="2"/>
    <path d="M210 470 L650 470 L770 530 L330 530 Z" fill="#dcecff" stroke="#87add1" stroke-width="2"/>
  </g>

  <g opacity="0.35" stroke="#5f7d98" stroke-width="1.5">
    <path d="M320 170 L440 230 M430 170 L550 230 M540 170 L660 230 M650 170 L770 230"/>
    <path d="M250 190 L690 190 M290 210 L730 210"/>
    <path d="M320 320 L440 380 M430 320 L550 380 M540 320 L660 380 M650 320 L770 380"/>
    <path d="M250 340 L690 340 M290 360 L730 360"/>
    <path d="M320 470 L440 530 M430 470 L550 530 M540 470 L660 530 M650 470 L770 530"/>
    <path d="M250 490 L690 490 M290 510 L730 510"/>
  </g>

  <g>
    <use href="#up-spin" x="295" y="190"/><use href="#up-spin" x="405" y="190"/><use href="#up-spin" x="515" y="190"/><use href="#up-spin" x="625" y="190"/>
    <use href="#up-spin" x="350" y="218"/><use href="#up-spin" x="460" y="218"/><use href="#up-spin" x="570" y="218"/><use href="#up-spin" x="680" y="218"/>
    <use href="#down-spin" x="295" y="340"/><use href="#down-spin" x="405" y="340"/><use href="#down-spin" x="515" y="340"/><use href="#down-spin" x="625" y="340"/>
    <use href="#down-spin" x="350" y="368"/><use href="#down-spin" x="460" y="368"/><use href="#down-spin" x="570" y="368"/><use href="#down-spin" x="680" y="368"/>
    <use href="#up-spin" x="295" y="490"/><use href="#up-spin" x="405" y="490"/><use href="#up-spin" x="515" y="490"/><use href="#up-spin" x="625" y="490"/>
    <use href="#up-spin" x="350" y="518"/><use href="#up-spin" x="460" y="518"/><use href="#up-spin" x="570" y="518"/><use href="#up-spin" x="680" y="518"/>
  </g>

  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <text x="795" y="205" font-size="18" font-weight="700" fill="#1769aa">FM plane A</text>
    <text x="795" y="355" font-size="18" font-weight="700" fill="#c23b4a">FM plane B</text>
    <text x="795" y="505" font-size="18" font-weight="700" fill="#1769aa">FM plane A</text>
    <text x="60" y="305" font-size="18" fill="#526171">stacking</text>
    <text x="60" y="329" font-size="18" fill="#526171">direction</text>
    <line x1="130" y1="450" x2="130" y2="205" stroke="#526171" stroke-width="3" marker-end="url(#arrow-blue)"/>
    <text x="142" y="214" font-size="20" font-style="italic" fill="#182433">z</text>
  </g>
</svg>
